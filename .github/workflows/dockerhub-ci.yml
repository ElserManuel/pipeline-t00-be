name: CI - Build and Push to DockerHub

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_ELSER }}
          password: ${{ secrets.DOCKERHUB_TOKEN_ELSER }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile-Elser/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME_ELSER }}/pipeline-t00-be:latest
            ${{ secrets.DOCKERHUB_USERNAME_ELSER }}/pipeline-t00-be:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max